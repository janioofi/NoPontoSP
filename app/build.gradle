plugins {
    id 'com.android.application'
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('local.properties')
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { stream ->
        releaseSigningProperties.load(stream)
    }
}

android {
    namespace 'com.janioofi.nopontosp'
    compileSdk 34

    defaultConfig {
        applicationId "com.janioofi.nopontosp"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    signingConfigs {
        release {
            def releaseStorePath = releaseSigningProperties.getProperty('RELEASE_STORE_FILE')
            if (releaseStorePath != null) {
                storeFile rootProject.file(releaseStorePath)
                storePassword releaseSigningProperties.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias releaseSigningProperties.getProperty('RELEASE_KEY_ALIAS')
                keyPassword releaseSigningProperties.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningProperties.getProperty('RELEASE_STORE_FILE') != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Build de depuração, conforme pedido: instalação inicial por APK de debug.
            debuggable true
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'

    // Rede: Retrofit + OkHttp (precisamos do OkHttp explicitamente para o CookieJar customizado)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Mapa OpenStreetMap, sem chave de API.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
