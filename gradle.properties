# Flags de projeto do Gradle/AGP.
# Mais sobre esses flags: http://www.gradle.org/docs/current/userguide/build_environment.html

# Tamanho de heap da JVM do daemon do Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Habilita o AndroidX (obrigatório: appcompat, material, recyclerview etc. só
# funcionam com isso ativado).
android.useAndroidX=true

# Converte automaticamente dependências legadas de Support Library para AndroidX,
# caso alguma biblioteca de terceiros ainda dependa delas.
android.enableJetifier=true

# Usa o Android Gradle Plugin em modo não-transitivo R classes (builds mais rápidos).
android.nonTransitiveRClass=true
